# This project runs inside the shared `gis` conda environment used across this
# accelerator repo (see modern-gis/SKILL.md §10 — "conda `gis` environment for all
# GIS/data processing (Windows)"), not a dedicated per-project environment. This
# file documents that environment's relevant packages for reproducibility; it is not
# meant to be used with `conda env create -f environment.yml` under this project's
# own name. See docs/DECISIONS.md for the rationale.
#
# To reproduce:
#   conda activate gis
#   conda install -n gis -c conda-forge pvlib   # only package missing from `gis`
name: gis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - geopandas=1.1.3
  - pandas=2.3.3
  - numpy=2.2.6
  - shapely=2.1.2
  - pyarrow=21.0.0
  - rasterio=1.4.3
  - rtree=1.4.1
  - fiona=1.10.1
  - gdal=3.10.3
  - duckdb=1.5.3
  - pvlib          # not yet in `gis` — install before running S4
  - pyyaml=6.0.3
  - matplotlib=3.10.8
  - jupyterlab=4.5.6
  - nbconvert-core=7.17.0
  - nbclient=0.10.4
  - ipython=8.37.0
  - requests=2.32.5

# tippecanoe (PMTiles generation, Stage S6) is NOT a conda/pip package on Windows.
# Per modern-gis/SKILL.md §7/§10: install via pipx inside WSL/Ubuntu, build PMTiles
# there, and copy the output back. Do not add it here.
